<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
        }

        .game {
            width: 420px;
            padding: 35px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .game-title {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #b8c4d4;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 13px 22px;
            border-radius: 12px;
            background: #ffffff;
            color: #182536;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
            background: #dce8f7;
        }

        button:active {
            transform: scale(0.95);
        }

        .moves {
            min-height: 65px;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.18);
        }

        .moves h2 {
            font-size: 16px;
            margin: 5px 0;
            font-weight: normal;
        }

        .result {
            font-size: 30px;
            margin: 22px 0;
            letter-spacing: 1px;
        }

        .score-board {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .score {
            flex: 1;
            padding: 15px 10px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
        }

        .score h3 {
            font-size: 14px;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .game {
                width: 90%;
                padding: 25px 18px;
            }

            .game-title {
                font-size: 27px;
            }

            .choices {
                gap: 7px;
            }

            button {
                padding: 11px 14px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <h1 class="game-title">Rock Paper Scissors</h1>
        <p class="subtitle">Choose your move and beat the computer!</p>

        <div class="choices">
            <button>Rock</button>
            <button>Paper</button>
            <button>Scissors</button>
        </div>

        <div class="moves">
            <h2></h2>
            <h2></h2>
        </div>

        <h1 class="result"></h1>

        <div class="score-board">
            <div class="score">
                <h3>Your Score : 0</h3>
            </div>

            <div class="score">
                <h3>Computer Score : 0</h3>
            </div>
        </div>

    </div>

<script>
    let buttons = document.querySelectorAll("button");

    let h2 = document.querySelectorAll("h2");
    let result = document.querySelector("h1");

    let Scores = document.querySelectorAll("h3");

    let yourScore = 0;
    let computerScore = 0;

    buttons[0].addEventListener("click", ()=>{
        let computer = Math.floor(Math.random()*3);

        if(computer == 0){
            computer = 'rock';
        }else if(computer == 1){
            computer = 'paper';
        }else{
            computer = 'scissors';
        }

        if("rock" === computer){
            h2[0].innerText = "You : rock";
            h2[1].innerText = "Computer : " + computer;
            result.innerText = "Tie";
        }else if(computer === "paper"){
            h2[0].innerText = "You : rock";
            h2[1].innerText = "Computer : " + computer;
            result.innerText = "You loose";
            computerScore++;
        }else{
            h2[0].innerText = "You : rock";
            h2[1].innerText = "Computer : " + computer;
            result.innerText = "You Win";
            yourScore++;
        }

        Scores[0].innerText = "Your Score : " + yourScore;
        Scores[1].innerText = "Computer Score : " + computerScore;
    })

    buttons[1].addEventListener("click", ()=>{
        let computer = Math.floor(Math.random()*3);

        if(computer == 0){
            computer = 'rock';
        }else if(computer == 1){
            computer = 'paper';
        }else{
            computer = 'scissors';
        }

        if("paper" === computer){
            h2[0].innerText = "You : paper";
            h2[1].innerText = "Computer : " + computer;
            result.innerText = "Tie";
        }else if(computer === "scissors"){
            h2[0].innerText = "You : paper";
            h2[1].innerText = "Computer : " + computer;
            result.innerText = "You loose";
            computerScore++;
        }else{
            h2[0].innerText = "You : paper";
            h2[1].innerText = "Computer : " + computer;
            result.innerText = "You Win";
            yourScore++;
        }

        Scores[0].innerText = "Your Score : " + yourScore;
        Scores[1].innerText = "Computer Score : " + computerScore;
    })

    buttons[2].addEventListener("click", ()=>{
        let computer = Math.floor(Math.random()*3);

        if(computer == 0){
            computer = 'rock';
        }else if(computer == 1){
            computer = 'paper';
        }else{
            computer = 'scissors';
        }

        if("scissors" === computer){
            h2[0].innerText = "You : scissors";
            h2[1].innerText = "Computer : " + computer;
            result.innerText = "Tie";
        }else if(computer === "rock"){
            h2[0].innerText = "You : scissors";
            h2[1].innerText = "Computer : " + computer;
            result.innerText = "You loose";
            computerScore++;
        }else{
            h2[0].innerText = "You : scissors";
            h2[1].innerText = "Computer : " + computer;
            result.innerText = "You Win";
            yourScore++;
        }

        Scores[0].innerText = "Your Score : " + yourScore;
        Scores[1].innerText = "Computer Score : " + computerScore;
    })
</script>

</body>
</html>
